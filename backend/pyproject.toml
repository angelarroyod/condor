[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "condor"
version = "0.1.0"
description = "Condor — paper trading terminal backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "websockets>=13.1",   # Binance WS client (see README design notes)
    "numpy>=2.1",         # pricing math only (Phase 3)
    "scipy>=1.14",        # pricing math only (Phase 3)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/condor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008: FastAPI's `Depends()`/`Query()` in defaults is the intended idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["condor"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# "." puts the backend root on sys.path so `from tests.conftest import ...`
# resolves under a bare `pytest` invocation (as CI runs it), not just `python -m pytest`.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
